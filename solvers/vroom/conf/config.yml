# vroom-express config for custom-matrix benchmarking. Every request carries its
# own `matrices.car.durations` (the instance's raw-OSRM matrix), so VROOM never
# contacts a routing backend. The osrm.car entry only exists so the "car"
# profile is recognized; it is never called.
cliArgs:
  geometry: false        # no route geometry (no OSRM backend)
  planmode: false
  threads: 4
  explore: 2             # search level 0..5. Kept at 2 (the value behind the published
                         # results): VROOM has no per-problem time budget, so `explore` is
                         # the only effort lever and it is server-wide — level 5 exploded on
                         # the 3,000-stop tail. Most instances solve in ms regardless.
  limit: '100mb'         # max request body (matrices can be large)
  logdir: '/..'
  logsize: '100M'
  maxlocations: 100000
  maxvehicles: 10000
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 900000        # ms (15 min) safety cap for the large-instance tail
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: '0.0.0.0'
      port: '5000'
