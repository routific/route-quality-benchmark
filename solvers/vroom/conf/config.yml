# vroom-express config for custom-matrix benchmarking. Every request carries its
# own `matrices.car.durations` (the instance's raw-OSRM matrix), so VROOM never
# contacts a routing backend. The osrm.car entry only exists so the "car"
# profile is recognized; it is never called.
cliArgs:
  geometry: false        # no route geometry (no OSRM backend)
  planmode: false
  threads: 6             # matches the 6-vCPU c2-standard-8 hardware the published runs used
  explore: 4             # search level 0..5. Published at 4 (near-max effort) so VROOM gets its
                         # strongest search. Level 5 exploded on the 3,000-stop tail; at 4 a
                         # few of the largest instances hit the 40-min server cap below and are
                         # left unserved. explore has no time budget — it's VROOM's only lever.
  limit: '100mb'         # max request body (matrices can be large)
  logdir: '/..'
  logsize: '100M'
  maxlocations: 100000
  maxvehicles: 10000
  override: true
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 2400000       # ms (40 min) safety cap for the large-instance tail
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: '0.0.0.0'
      port: '5000'
